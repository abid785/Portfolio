version: '3.9'

services:
  # ── Next.js Frontend ────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portfolio_client
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://server:5000
      - BACKEND_URL=http://server:5000
    depends_on:
      - server
    networks:
      - portfolio_net
    restart: unless-stopped

  # ── Express Backend ─────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio_server
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
    networks:
      - portfolio_net
    restart: unless-stopped

networks:
  portfolio_net:
    driver: bridge
