# ============================================================
#  Netlify Configuration — Abid Hussain Portfolio
# ============================================================

[build]
  base    = "client"
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--legacy-peer-deps"

# Next.js Runtime plugin (auto-detects, but pin it explicitly)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect all routes to Next.js (handled by the plugin, but
# a catch-all ensures correct SPA-like behaviour as fallback)
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/___netlify-handler"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
